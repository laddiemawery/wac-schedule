<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAC Daily Schedule</title>
  <style>
    body { margin: 0; padding: 32px 16px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #16202b; background: #f2f4f7; }
    @media (prefers-color-scheme: dark) { body { color: #e6edf3; background: #0e141a; } a { color: #5bb0d9; } }
  </style>
</head>
<body>
  <p id="wac-status">Loading the WAC schedule… (the first load can take a few seconds)</p>
  <script>
    // Loads the schedule page from the Apps Script web app and shows it here.
    // fetch() sends no Google sign-in, so this works for people signed in to
    // several Google accounts, which Apps Script web apps don't support.
    // Filters in this page's address (?school=MAY&view=week) still apply.
    // To embed in a Google Site, use APP + '?format=page&embed=1'.
    var APP = 'https://script.google.com/macros/s/AKfycbz4WgaCmNRhpmtJFSnwdfcDdITY01pwcJol8XLg0g50CFZxWvIJGkOWcdU3bJJGLjhW/exec';
    fetch(APP + '?format=page')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.getElementById('wac-status').innerHTML =
          'The schedule could not be loaded right now. <a href="' + APP + '">Open it on Google</a>.';
      });
  </script>
</body>
</html>
